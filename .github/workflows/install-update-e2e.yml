name: Install & Update E2E

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  pick-release-tags:
    name: Pick Release Tags
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.tag-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch upstream release tags
        run: |
          set -eo pipefail
          git fetch --tags --force https://github.com/nousresearch/hermes-agent.git 'refs/tags/*:refs/tags/*' || true
          git tag -l

      - name: Extract and validate release tags
        id: tag-matrix
        run: |
          set -eo pipefail
          python3 scripts/pick_release_tags.py --output-github --limit 3

  installer:
    name: Test Installer
    needs: pick-release-tags
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.pick-release-tags.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test installer for tag ${{ matrix.tag }}
        run: |
          echo "Testing installer for ${{ matrix.tag }}"
          # Add installer test logic here

  update:
    name: Test Update
    needs: pick-release-tags
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.pick-release-tags.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test update for tag ${{ matrix.tag }}
        run: |
          echo "Testing update for ${{ matrix.tag }}"
          # Add update test logic here
